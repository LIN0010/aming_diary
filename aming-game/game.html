<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>尋軌：阿明的日記</title>
    <link rel="stylesheet" href="css/common.css" id="common-style">
    <link rel="stylesheet" href="css/app.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body data-scene-shell>
    <div id="scene-host"></div>
    <script src="js/entry-cache.js"></script>
    <script>JourneyEntryCache.preview(document.getElementById("scene-host"));</script>
    <!-- 只在載入失敗時顯示錯誤操作，不作為進場或換場遮罩。 -->
    <section id="scene-loading" class="scene-loading" aria-label="旅程載入失敗" hidden>
        <p id="scene-status" role="status" tabindex="-1"></p>
        <div class="scene-loading-actions">
            <button id="scene-retry" type="button" hidden>重新載入</button>
            <button id="scene-cancel" type="button" hidden>留在目前畫面</button>
            <a id="scene-fallback" href="home.html">開啟原版頁面</a>
        </div>
    </section>
    <noscript>請開啟 JavaScript，以繼續這段旅程。</noscript>
    <script src="js/navigation.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/scenes.js"></script>
    <script src="js/home.js"></script>
    <script src="js/explore.js"></script>
    <script src="vendor/page-flip/page-flip.browser.js"></script>
    <script src="js/diary.js"></script>
    <script src="js/event-config.js"></script>
    <script src="js/event-store.js"></script>
    <script src="js/event.js"></script>
    <script src="js/guild-config.js"></script>
    <script src="js/guild-store.js"></script>
    <script src="js/guild.js"></script>
    <script src="js/travel-transition.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
