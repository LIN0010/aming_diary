<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StPageFlip HTML 驗證</title>
<style>body{margin:0;background:#bba58b;font-family:serif}.stage{width:90vw;height:75vh;margin:5vh auto}.page{background:#f5ecdb;padding:20px;box-sizing:border-box}.hard{background:#4a2f22;color:#ead9b7}nav{position:relative;z-index:2;text-align:center}button,input{font:inherit}</style>
<div class="stage" id="book"><section class="page hard" data-density="hard">阿明的日記</section><section class="page">目錄左頁<button id="inside">頁內按鈕</button><output id="clicked"></output></section><section class="page">目錄右頁<input placeholder="可輸入文字"></section><section class="page">站點左頁</section><section class="page">站點右頁</section><section class="page hard" data-density="hard">封底</section></div><nav><button id="next">開書／下一頁</button><button id="prev">上一頁／闔上</button></nav>
<script src="vendor/page-flip/page-flip.browser.js"></script><script>
window.flip=new St.PageFlip(document.querySelector('#book'),{width:400,height:540,size:'stretch',minWidth:100,maxWidth:600,minHeight:150,maxHeight:800,showCover:true,autoSize:false,usePortrait:false,useMouseEvents:false,flippingTime:450});flip.loadFromHTML(document.querySelectorAll('.page'));document.querySelector('#next').onclick=()=>flip.flipNext();document.querySelector('#prev').onclick=()=>flip.flipPrev();document.querySelector('#inside').onclick=()=>document.querySelector('#clicked').textContent='成功';
</script></html>
